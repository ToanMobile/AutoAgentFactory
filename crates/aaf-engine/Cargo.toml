[package]
name = "aaf-engine"
description = "Core engine of AutoAgentFactory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The workspace lints, except `unsafe_code`: "deny" instead of "forbid", so
# that ONE module may allow it. Owner decision 2026-11-22 (SECURITY.md §10):
# `executors/sandbox_check.rs` binds libsystem's `sandbox_check` for the
# reaper. Every other module still fails to build with `unsafe`. Keep the
# clippy list in step with `[workspace.lints.clippy]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
aaf-domain = { path = "../aaf-domain" }
aaf-fp = { path = "../aaf-fp" }
globset = "0.4.21"
plist = "1.10.4"
portable-pty = "0.9.0"
quick-xml = "0.42.0"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.2"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
uuid = { version = "1.29.3", features = ["v4"] }
