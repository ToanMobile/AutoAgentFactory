name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "${TAG}" in
            v[0-9]*) ;;
            *)
              echo "Invalid release tag '${TAG}': expected v<semver>" >&2
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" -p aaf-cli -p aaf-hook

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          PKG_DIR="aaf-${TAG}-${TARGET}"
          mkdir -p "staging/${PKG_DIR}" dist
          cp "target/${TARGET}/release/aaf" "staging/${PKG_DIR}/aaf"
          cp "target/${TARGET}/release/aaf-hook" "staging/${PKG_DIR}/aaf-hook"
          chmod 0755 "staging/${PKG_DIR}/aaf" "staging/${PKG_DIR}/aaf-hook"
          cp LICENSE README.md "staging/${PKG_DIR}/"
          tar -czf "dist/${PKG_DIR}.tar.gz" -C staging "${PKG_DIR}"
          ls -lh "dist/${PKG_DIR}.tar.gz"

      - name: Upload target tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/aaf-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum aaf-*.tar.gz | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/aaf-*.tar.gz
            dist/SHA256SUMS.txt
