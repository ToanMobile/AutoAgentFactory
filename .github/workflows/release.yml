name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Validate release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [ "${GITHUB_REF}" != "refs/tags/${TAG}" ]; then
              echo "Release must be triggered from a tag ref" >&2
              exit 1
            fi
          fi
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "${TAG}" =~ $re ]]; then
            echo "Invalid release tag: expected vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: build (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Install Rust toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${TARGET}"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}" -p aaf-cli -p aaf-hook

      - name: Package tarball (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          PKG_DIR="aaf-${TAG}-${TARGET}"
          mkdir -p "staging/${PKG_DIR}" dist
          cp "target/${TARGET}/release/aaf" "staging/${PKG_DIR}/aaf"
          cp "target/${TARGET}/release/aaf-hook" "staging/${PKG_DIR}/aaf-hook"
          chmod 0755 "staging/${PKG_DIR}/aaf" "staging/${PKG_DIR}/aaf-hook"
          cp LICENSE README.md "staging/${PKG_DIR}/"
          tar -czf "dist/${PKG_DIR}.tar.gz" -C staging "${PKG_DIR}"
          ls -lh "dist/${PKG_DIR}.tar.gz"

      - name: Package zip archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = $env:TAG
          $Target = $env:TARGET
          $PkgDir = "aaf-$Tag-$Target"
          $StageDir = Join-Path "staging" $PkgDir
          New-Item -ItemType Directory -Path $StageDir -Force | Out-Null
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item "target/$Target/release/aaf.exe" (Join-Path $StageDir "aaf.exe")
          Copy-Item "target/$Target/release/aaf-hook.exe" (Join-Path $StageDir "aaf-hook.exe")
          Copy-Item "LICENSE", "README.md" $StageDir
          Compress-Archive -Path $StageDir -DestinationPath "dist/$PkgDir.zip" -Force
          Get-Item "dist/$PkgDir.zip" | Format-List Name, Length

      - name: Upload target archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/aaf-*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum aaf-*.tar.gz aaf-*.zip | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/aaf-*.tar.gz
            dist/aaf-*.zip
            dist/SHA256SUMS.txt
