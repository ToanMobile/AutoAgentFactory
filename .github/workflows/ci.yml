name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests get the fast Ubuntu run; macOS (about twice as slow)
        # runs on every push to main.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest", "ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # With no arguments rustup installs the channel and components pinned
      # in rust-toolchain.toml, so CI and local builds cannot drift apart.
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs every test in its own process and runs the test binaries
      # in parallel, where cargo test runs them one after the other. The
      # binary lands in ~/.cargo/bin, which rust-cache keeps between runs.
      - name: Install cargo-nextest
        run: |
          if ! cargo nextest --version 2>/dev/null | grep -q "^cargo-nextest ${NEXTEST_VERSION} "; then
            cargo install cargo-nextest --locked --version "${NEXTEST_VERSION}"
          fi
        env:
          NEXTEST_VERSION: 0.9.152

      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc
