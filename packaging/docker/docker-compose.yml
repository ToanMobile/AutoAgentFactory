services:
  aaf:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: aaf:local
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    environment:
      HOME: /home/aaf
      AAF_DATA_DIR: /home/aaf/.local/share/autofactory
      AAF_CONFIG_DIR: /home/aaf/.config/autofactory
    working_dir: /workspace
    volumes:
      - ${AAF_WORKSPACE:-../..}:/workspace
      - aaf-data:/home/aaf/.local/share/autofactory
      - aaf-config:/home/aaf/.config/autofactory

volumes:
  aaf-data:
  aaf-config:
